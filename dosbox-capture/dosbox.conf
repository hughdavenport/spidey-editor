# DOSBox-X config for headless ground-truth captures. GAMEDIR is substituted
# by dosroom.sh. Window = 320x200 doubled to 640x400, no scaler, no aspect
# correction, so every game pixel is an exact 2x2 block in the capture.
[sdl]
fullscreen=false
output=surface
autolock=false
[dosbox]
machine=svga_s3
captures=GAMEDIR/capture
[cpu]
core=normal
cycles=3000
[render]
aspect=false
scaler=none
[mixer]
nosound=true
[autoexec]
mount c GAMEDIR
c:
SPIDEY.EXE
